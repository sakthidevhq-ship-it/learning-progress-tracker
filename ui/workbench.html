<title>Workbench</title>
<style>
:root{
  --bg:#0e1013;--bg2:#13161b;--panel:#171a20;--panel2:#1c2027;--line:#262b33;--line2:#323843;
  --tx:#e8eaed;--tx2:#a3a9b3;--tx3:#6c737e;--acc:#e9c46a;--ok:#5fcf8f;--warn:#e9a15a;--bad:#e06c6c;
  --r:10px;--sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;--serif:"Iowan Old Style","Charter",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;white-space:nowrap}
a{color:#9fc4ff}
.num{font-variant-numeric:tabular-nums}
.hsp{flex:1}
.muted{color:var(--tx3)}
/* header */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:28px;height:58px;padding:0 28px;background:rgba(14,16,19,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:600 15px var(--sans);letter-spacing:.01em}
.brand svg{width:20px;height:20px;flex:none}
nav{display:flex;gap:4px;height:100%}
nav button{background:none;border:0;padding:0 14px;height:100%;color:var(--tx2);font-weight:500;position:relative;display:flex;align-items:center;gap:8px}
nav button:hover,nav button.on{color:var(--tx)}
nav button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--acc);border-radius:2px}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--panel2);color:var(--tx2)}
.badge:empty{display:none}
.badge.new{background:rgba(233,196,106,.16);color:var(--acc)}
.search{display:flex;align-items:center;gap:8px;width:280px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--tx3)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:13px var(--sans);outline:none}
.search:focus-within{border-color:var(--line2)}
kbd,.k{font:11px var(--sans);border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--tx3)}
.robadge{font-size:12px;color:var(--tx3);border:1px dashed var(--line2);border-radius:7px;padding:5px 10px;display:none}
.ro .robadge{display:inline-block}
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#4a5260}
.btn.pri{background:var(--acc);color:#1b1608;border-color:transparent;font-weight:600}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.ghost{background:none;border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{color:var(--tx);background:var(--panel)}
.btn:disabled{opacity:.35;cursor:default}
.ro .ed{display:none!important}
#saveBtn{display:none;color:var(--tx3)}
body.cansave #saveBtn{display:inline-flex}
#saveBtn .si{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#saveBtn .si .up{display:none}
#saveBtn.dirty{color:var(--tx);border-color:rgba(233,196,106,.45)}
#saveBtn.dirty .si,#saveBtn.busy .si{color:var(--acc)}
#saveBtn.dirty .si .ok,#saveBtn.busy .si .ok{display:none}
#saveBtn.dirty .si .up,#saveBtn.busy .si .up{display:inline}
#saveBtn.busy .si .up{animation:svu .9s ease-in-out infinite}
@keyframes svu{0%{transform:translateY(2px);opacity:.3}60%{transform:translateY(-1px);opacity:1}100%{transform:translateY(-2px);opacity:0}}
main{max-width:1280px;margin:0 auto;padding:30px 28px 80px}
.tab{display:none}.tab.on{display:block}
h1{font:400 30px/1.15 var(--serif);margin:0;letter-spacing:-.01em}
h2{font:600 11.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin:0 0 12px;display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap}
h2 .c{color:var(--tx2);letter-spacing:0}
h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--tx3)}
.sub{color:var(--tx2);margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--c,#888)}
.chip{white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--tx2)}
.chip.project{color:#9fd1ff;border-color:rgba(159,209,255,.35)}
.chip.practice{color:#c9a7ff;border-color:rgba(201,167,255,.35)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.empty{padding:22px;color:var(--tx2);font-size:14px;line-height:1.55}
.empty b{color:var(--tx);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 11px;font-size:12.5px;color:var(--tx2)}
.seg button.on{background:var(--panel2);color:var(--tx)}
.inp{width:100%;height:42px;border:1px solid var(--line2);background:var(--bg);border-radius:8px;padding:0 12px;color:var(--tx);font:15px var(--sans);margin-bottom:10px}
.inp:focus{outline:0;border-color:var(--acc)}
/* workbench */
.wbhead{display:flex;align-items:flex-end;gap:20px;margin-bottom:28px}
.wbgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px}
.picked{display:flex;flex-direction:column;gap:10px}
.pc{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;border-left:3px solid var(--c);cursor:pointer}
.pc:hover{border-color:var(--line2);border-left-color:var(--c)}
.pc .where{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);min-width:0}
.pc .ttl{font:500 16px/1.35 var(--sans);grid-column:1;overflow-wrap:anywhere}
.pc .meta{grid-column:1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--tx3)}
.pc .age{grid-column:2;grid-row:1/3;text-align:right;align-self:start}
.pc .age b{font:500 20px var(--sans);display:block}.pc .age span{font-size:11.5px;color:var(--tx3)}
.pc .age.stale b{color:var(--warn)}
.pc .acts{grid-column:2;grid-row:4;display:flex;gap:6px;justify-content:flex-end;align-self:end}
.lastlog{grid-column:1;font-size:13px;color:var(--tx2);margin-top:4px;padding:7px 10px;background:var(--bg2);border-radius:7px;border:1px solid var(--line);overflow-wrap:anywhere}
.logbtn{border-color:rgba(233,196,106,.45);color:var(--acc)}
.side .card{padding:16px 18px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type,h2+.row,.gl+.row{border-top:0}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.row .t:hover{color:#fff}
.pr{font-size:11.5px;font-weight:600}
.pr.now{color:var(--acc)}.pr.soon{color:#9fd1ff}.pr.someday{color:var(--tx3)}
/* plan */
.psec{padding:16px 18px;margin-bottom:16px}
.prow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.gl+.prow,h2+.prow{border-top:0}
.pt{flex:1;min-width:0}.pt .t{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pt .t:hover{color:#fff}
.ps{font-size:12px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;color:var(--ok)}
.from{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:#c9b27a;border:1px solid #4a4330;border-radius:5px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.gl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:14px 0 2px}
h2+.gl{margin-top:4px}
.fit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fit div{padding:10px 12px;border-radius:8px;background:var(--bg2)}
.fit b{display:block;font:500 22px var(--sans)}.fit span{font-size:11.5px;color:var(--tx3)}.fit .now{outline:1px solid rgba(233,196,106,.4)}.fit .now b{color:var(--acc)}
.pp{font-size:11.5px;font-weight:600;border:1px solid var(--line2);background:none;border-radius:6px;padding:2px 8px;white-space:nowrap}
.pp.none{color:var(--tx3);border-style:dashed;font-weight:500}
.pp.now{color:var(--acc);border-color:rgba(233,196,106,.4)}.pp.soon{color:#9fd1ff;border-color:rgba(159,209,255,.35)}.pp.someday{color:var(--tx2)}
.item .pp.none,.prow .pp.none{opacity:0}.item:hover .pp.none,.prow:hover .pp.none{opacity:1}
.ro .pp{pointer-events:none}.ro .pp.none{display:none}
/* library */
.libgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px}
.areas{position:sticky;top:88px;align-self:start;max-height:calc(100vh - 110px);overflow:auto}
.ar{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px}
.ar:hover{background:var(--panel)}
.ar .n{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px}
.ar .n em{margin-left:auto;font-style:normal;font-size:12px;color:var(--tx3)}

<body class="ro">
<header>
  <div class="brand"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d27e"/><stop offset="1" stop-color="#c98a3a"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#wbg)"/><g fill="#1b1608"><rect x="7.5" y="8" width="4" height="16" rx="1.4"/><rect x="13.2" y="10.5" width="4" height="13.5" rx="1.4"/><rect x="19.2" y="8.6" width="4" height="15.8" rx="1.4" transform="rotate(14 21.2 24.4)"/></g></svg><span>Workbench</span></div>
  <nav>

  <div class="hsp"></div>

  <span class="robadge" title="Run `lpt serve` on your laptop to edit">Read-only</span>
  <button class="btn ed" id="saveBtn" onclick="saveAll()"><svg class="si" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.4 9.1 4.75 4.75 0 0 0 7 18.5z"/><path class="ok" d="M9.4 13.4l2 2 3.6-3.8"/><path class="up" d="M12 16.2V10.6M9.6 12.9 12 10.5l2.4 2.4"/></svg><span id="saveLbl">Saved</span></button>
  <button class="btn pri ed" id="addBtn">+ <span class="al">Add</span> <span class="k" style="border-color:rgba(0,0,0,.25);color:#5a4a1a">A</span></button>
</header>
<main>
  <section class="tab on" id="t-wb"></section>

  <textarea class="inp" id="addText" rows="3" style="height:auto;padding:10px 12px;resize:vertical;font-size:14px" placeholder="Paste a link or type a title.&#10;Several lines add several items, e.g. a batch of links from WhatsApp."></textarea>

  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <div class="seg" id="addType"><button class="on" data-v="article">Resource</button><button data-v="project">Project</button><button data-v="practice">Practice</button></div>
    <div class="seg" id="addPrio"><button class="on" data-v="">No priority</button><button data-v="now">now</button><button data-v="soon">soon</button><button data-v="someday">someday</button></div>
  </div>
  <div class="hintline">↳ Lands in <b style="color:var(--tx2)">Unsorted</b>. Claude files each one into an area and topic later.</div>
  <div class="mfoot"><span class="muted" style="font-size:12px">⌘⏎ to save · Esc to close</span><span class="hsp"></span><button class="btn ghost" id="addCancel">Cancel</button><button class="btn pri" id="addSave">Save to library</button></div>
</div>
<div class="toast" id="toast"></div>
<script>
const RAW = VAULT_PLACEHOLDER;
const META = META_PLACEHOLDER;

// ---------- dates ----------
const DAY = 864e5;
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateOf = s => new Date(s+'T12:00:00');
const addDays = (s,n) => isoOf(new Date(dateOf(s).getTime() + n*DAY));
const addMonths = (m,n) => { const d = new Date(+m.slice(0,4), +m.slice(5,7)-1+n, 15); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const fmt = s => s ? dateOf(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '';
const days = s => Math.round((dateOf(TODAY) - dateOf(s))/DAY);
const mShort = m => new Date(+m.slice(0,4), +m.slice(5,7)-1, 15).toLocaleDateString('en-GB',{month:'short'});
const mLong = m => new Date(+m.slice(0,4), +m.slice(5,7)-1, 15).toLocaleDateString('en-GB',{month:'long'});
const monthOf = d => d.slice(0,7);
let TODAY, MONTH, NEXT, WEEKS;
function setToday(){
  TODAY = isoOf(new Date()); MONTH = monthOf(TODAY); NEXT = addMonths(MONTH,1);
  const dow = (dateOf(TODAY).getDay()+6)%7, mon = addDays(TODAY,-dow);
  WEEKS = Array.from({length:6}, (_,k) => { const s = addDays(mon, -(5-k)*7); return {start:s, end:addDays(s,6)}; });
}
setToday();

// ---------- data ----------
let items = [], LIVE = false, seq = 0;
const byK = new Map();
function norm(r){
  const old = items.find(i => i.id === r.id);
  const it = {...r, k: old ? old.k : seq++, sessions: r.sessions||[], checks: r.checks||[], concepts: r.concepts||[], notes: r.notes||''};
  byK.set(it.k, it);
  return it;
}
function setItems(list){ const next = list.map(norm); items = next; byK.clear(); items.forEach(i => byK.set(i.k, i)); }
function replace(r){ const it = norm(r); const ix = items.findIndex(i => i.k === it.k); if (ix >= 0) items[ix] = it; else items.push(it); byK.set(it.k, it); return it; }
const K = k => byK.get(k);
const sum = a => a.reduce((s,x)=>s+x,0);
const total = i => sum(i.sessions.map(s=>s.m));
const todayM = i => i.sessions.find(s=>s.d===TODAY)?.m || 0;
const lastWorked = i => i.sessions.length ? i.sessions[i.sessions.length-1].d : '';
const allSessions = () => items.flatMap(i => i.sessions.map(s => ({...s, i})));
const fmtH = m => { m = Math.round(m); const h = Math.floor(m/60), r = m%60; return (h ? h+'h' : '') + (r ? (h?' ':'')+r+'m' : '') || '0m'; };
const live = i => i.state !== 'dropped';
const cov = list => { const l = list.filter(live); return {done:l.filter(i=>i.state==='done').length, picked:l.filter(i=>i.state==='picked').length, total:l.length}; };
const coverageAt = (list, d) => { const s = list.filter(i => (i.ingested||'0000') <= d && !(i.dropped && i.dropped <= d)); return {done:s.filter(i => i.done && i.done <= d).length, total:s.length}; };
const groupBy = (arr, f) => arr.reduce((m,x)=>((m[f(x)] ||= []).push(x), m), {});
const PR = {now:0, soon:1, someday:2};
const byPrio = (a,b) => (PR[a.prio]??3)-(PR[b.prio]??3) || ((b.ingested||'') > (a.ingested||'') ? 1 : -1);
const isBuild = i => i.type==='project' || i.type==='practice';
const inPlan = M => items.filter(i => i.planned && i.planned <= M && i.state !== 'dropped' && (i.state !== 'done' || monthOf(i.done||'') === M));
const FOCUS = (META && META.domainWeights) || {};
const focusOf = a => FOCUS[a] ?? .5;

// ---------- look ----------
const AREA_COLORS = {'ML/Infrastructure':'#6aa8ff','ML/Foundations':'#a78bfa','Systems':'#4fd1c5','Game AI':'#f6ad55','ML/Agents':'#68d391','ML/Voice':'#f687b3','Networking':'#63b3ed','ML/Frameworks':'#b794f4','Embedded/Gaming':'#fbd38d','Unsorted':'#e9c46a'};
const PALETTE = ['#7dd3fc','#fca5a5','#86efac','#fcd34d','#c4b5fd','#f9a8d4','#5eead4','#fdba74'];
const col = a => AREA_COLORS[a] || PALETTE[[...a].reduce((h,c)=>h*31+c.charCodeAt(0)>>>0,7) % PALETTE.length];
const short = a => a.replace('ML/','ML ').replace('Infrastructure','Infra');
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const typeChip = t => t==='project'||t==='practice' ? ` <span class="chip ${t}">${t}</span>` : '';
const clip = (s,n) => s.length > n ? s.slice(0,n-1)+'…' : s;
function toast(m, err){ const t=$('#toast'); t.textContent=m; t.classList.toggle('err',!!err); t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'), err?4000:2000); }
const prioPill = i => `<button class="pp ${i.prio||'none'}" onclick="event.stopPropagation();cyclePrio(${i.k})" title="Priority: click to change">${i.prio||'set priority'}</button>`;

// ---------- saving ----------
async function post(path, body){
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body), keepalive:true});
  let j = {}; try { j = await r.json(); } catch(e) {}
  if (!r.ok || !j.ok) throw new Error(j.error || `HTTP ${r.status}`);
  if (path !== '/api/save') saveStatus();
  return j;
}
// Save = commit the vault and push to GitHub (lpt save). Shown only when the server can do it.
let SAVE = {available:false, pending:0}, saving = false;
function renderSave(){
  const b = $('#saveBtn');
  document.body.classList.toggle('cansave', LIVE && SAVE.available);
  b.classList.toggle('dirty', (SAVE.pending > 0 || SAVE.unpushed > 0) && !saving);
  b.classList.toggle('busy', saving);
  b.disabled = saving;
  $('#saveLbl').textContent = saving ? 'Saving…' : SAVE.pending ? `Save · ${SAVE.pending}` : SAVE.unpushed ? 'Save · push' : 'Saved';
  b.title = SAVE.pending ? `${SAVE.pending} changed page${SAVE.pending>1?'s':''} not on GitHub yet. Click (or S) to commit and push to ${SAVE.target}`
          : SAVE.unpushed ? `Committed but not pushed to ${SAVE.target} yet. Click (or S) to try again`
          : `Everything is on GitHub (${SAVE.target||''})`;
}
async function saveStatus(){
  try {
    const j = await (await fetch('/api/save', {cache:'no-store'})).json();
    if (j.ok) { SAVE = j; renderSave(); }
  } catch(e) {}
}
async function saveAll(){
  if (!LIVE || saving) return;
  if (notesTimer && drawerK !== null) { clearTimeout(notesTimer); await saveNotes(drawerK); }
  saving = true; renderSave();
  try {
    const j = await post('/api/save', {});
    toast(j.committed || j.pushed ? `Saved to GitHub · the site updates in a minute` : 'Already saved: nothing new');

  notesTimer = null;
  const box = $('#notesBox'); if (!box || !LIVE) return;
  const text = box.value, it = K(k);
  if (text === it.notes) { const s=$('#notesState'); if (s) s.textContent=''; return; }
  try {
    const j = await post('/api/item', {id: it.id, action:'notes', text});
    replace(j.item); renderWB(); renderLib();
    const s = $('#notesState'); if (s && drawerK === k) s.textContent = 'saved';
  } catch(e) { toast(`Couldn't save notes: ${e.message}`, true); }
}

// ---------- insights ----------
function renderIns(){
  const from = WEEKS[0].start, to = WEEKS[5].end;
  const S = allSessions().filter(s=>s.d>=from && s.d<=to);
  const H = sum(S.map(s=>s.m)), buildH = sum(S.filter(s=>isBuild(s.i)).map(s=>s.m));
  const doneIn = items.filter(i=>i.done && i.done>=from), collIn = items.filter(i=>i.ingested && i.ingested>=from);
  const wk = WEEKS.map(w=>{ const ss=S.filter(s=>s.d>=w.start&&s.d<=w.end); return {w, h:sum(ss.map(s=>s.m)), b:sum(ss.filter(s=>isBuild(s.i)).map(s=>s.m)), byA:groupBy(ss,s=>s.i.area), done:doneIn.filter(i=>i.done>=w.start&&i.done<=w.end)}; });
  const maxH = Math.max(240, ...wk.map(x=>x.h));
  const areaNames = [...new Set([...Object.keys(FOCUS), ...S.map(s=>s.i.area), ...doneIn.map(i=>i.area)])].filter(a=>a!=='Unsorted' && items.some(i=>i.area===a));
  const areas = areaNames.map(a=>{ const ss=S.filter(s=>s.i.area===a), l=items.filter(i=>i.area===a); return {a, h:sum(ss.map(s=>s.m)), f:focusOf(a), done:doneIn.filter(i=>i.area===a).length, c:cov(l), c0:coverageAt(l, addDays(from,-1))}; }).sort((x,y)=>y.f-x.f||y.h-x.h);
  const topT = Object.entries(groupBy(S, s=>s.i.area)).map(([a,ss])=>({a, h:sum(ss.map(s=>s.m))})).sort((x,y)=>y.h-x.h)[0], topF = areas[0];
  const maxAH = Math.max(1, ...areas.map(r=>r.h));
  const stalled = items.filter(i=>i.state==='picked' && days(lastWorked(i)||i.picked||TODAY)>=14);
  const noLog = doneIn.filter(i=>!i.sessions.length).length;
  const pct = x => H ? Math.round(x/H*100) : 0;
  const insights = H ? [
    `<b>${pct(topT.h)}%</b> of your time went to <b>${esc(short(topT.a))}</b>.`,
    !topF ? `Set career focus weights in config.yaml to see how your time lines up with them.` : topF.a===topT.a ? `Your top career focus, <b>${esc(short(topF.a))}</b>, also got the most time.` : topF.h ? `<b>${esc(short(topF.a))}</b> is your top career focus and got <b>${pct(topF.h)}%</b> (${fmtH(topF.h)}).` : `<b>${esc(short(topF.a))}</b>, your top career focus, got no time yet.`,
    `<b>${pct(buildH)}%</b> was building (projects and practice); the rest was reading and watching.`,
    `You collected <b>${collIn.length}</b> and finished <b>${doneIn.length}</b>.${collIn.length>doneIn.length*2&&collIn.length>3?' The library grew faster than you finished.':''}`,
  ] : [`No time logged in the last six weeks yet. Use <b>+30m</b> on whatever you work on and this page fills in.`, `You collected <b>${collIn.length}</b> and finished <b>${doneIn.length}</b> in this window.`];
  $('#t-ins').innerHTML = `
  <div class="rvhead"><div><h1>The last six weeks</h1><div class="sub">${fmt(from)} – ${fmt(to)} · <b style="color:var(--tx)">${fmtH(H)}</b> logged · <b style="color:var(--tx)">${doneIn.length}</b> finished</div></div></div>
  <div class="insights">${insights.map(s=>`<div class="card ins">${s}</div>`).join('')}</div>
  <div class="ins2">
    <div>
      <h2>Time per week</h2>
      <div class="card weeks">
        ${wk.map((x,n)=>`<div class="wk ${n===5?'cur':''}">
          <div class="hh num">${x.h?fmtH(x.h):'—'}</div>
          <div class="col">${Object.entries(x.byA).map(([a,ss])=>`<i style="height:${sum(ss.map(s=>s.m))/maxH*100}%;background:${col(a)}" title="${esc(short(a))} · ${fmtH(sum(ss.map(s=>s.m)))}"></i>`).join('')}</div>
          <div class="wl2">${n===5?'This week':fmt(x.w.start)}</div>
          <div class="lb"><i style="width:${x.h?x.b/x.h*100:0}%"></i></div>
          <div class="wd">${x.done.map(i=>`<span title="${esc(i.title)}">✓ ${esc(clip(i.title,20))}</span>`).join('')}</div>
        </div>`).join('')}
      </div>
      <div class="legend"><span><i class="lbk"></i>green line = share spent building</span><span>✓ finished that week</span><span>hover a bar for the area</span></div>
    </div>
    <div>
      <h2>Learning vs building</h2>
      <div class="card" style="padding:18px">
        <div class="split">${H?`<i style="flex:${H-buildH};background:#6aa8ff"></i><i style="flex:${buildH};background:var(--ok)"></i>`:''}</div>
        <div class="splitl"><span><b class="num">${fmtH(H-buildH)}</b> learning${H?` · ${100-pct(buildH)}%`:''}</span><span><b class="num">${fmtH(buildH)}</b> building${H?` · ${pct(buildH)}%`:''}</span></div>
        <div class="muted" style="font-size:12.5px;margin-top:12px">Learning = papers, articles, videos, docs. Building = projects and practice.</div>
      </div>
      <h2 style="margin-top:22px">Stalled <span class="c">${stalled.length}</span><span class="r">picked up, no time in 14+ days</span></h2>
      <div class="card" style="padding:4px 16px">${stalled.length?stalled.map(i=>`<div class="row"><span class="dot" style="--c:${col(i.area)}"></span><span class="t" onclick="openItem(${i.k})">${esc(i.title)}</span><span class="muted num" style="font-size:12px">${days(lastWorked(i)||i.picked)}d</span></div>`).join(''):'<div class="row muted">Nothing stalled.</div>'}</div>
    </div>
  </div>
  <h2 style="margin-top:30px">Direction <span class="r">areas ordered by your career focus (config.yaml)</span></h2>
  <div class="card" style="padding:6px 18px 10px">
    <div class="drow head"><span>Area</span><span>Focus</span><span>Share of time</span><span>Finished</span><span>Coverage</span></div>
    ${areas.map(r=>`<div class="drow ${r.h?'':'dim'}"><span><span class="dot" style="--c:${col(r.a)};margin-right:9px"></span>${esc(short(r.a))}</span>
      <span class="fdots" title="focus ${r.f}">${[.6,.75,.85].map(t=>`<i class="${r.f>=t?'on':''}"></i>`).join('')}</span>
      <span class="tb">${r.h?`<i style="width:${r.h/maxAH*100}%;max-width:150px;background:${col(r.a)}"></i>`:''}<em class="num">${r.h?pct(r.h)+'% · '+fmtH(r.h):'no time'}</em></span>
      <span class="num">${r.done||'<span class="muted">—</span>'}</span>
      <span class="num">${r.c.done}/${r.c.total}${r.c.done>r.c0.done?` <span style="color:var(--ok);font-size:12px">+${r.c.done-r.c0.done}</span>`:''}</span></div>`).join('')}
  </div>
  ${noLog?`<div class="muted" style="font-size:12px;margin-top:14px">${noLog} of ${doneIn.length} finished items have no time logged, so the time figures undercount.</div>`:''}`;
}

// ---------- add ----------
function openAdd(){ if (!LIVE) return readOnly(); document.body.classList.add('md'); setTimeout(()=>$('#addText').focus(), 50); }
function closeAdd(){ document.body.classList.remove('md'); }
document.querySelectorAll('#addType button,#addPrio button').forEach(b => b.onclick = () => [...b.parentNode.children].forEach(x => x.classList.toggle('on', x===b)));
async function saveAdd(){
  const text = $('#addText').value;
  if (!text.trim()) return toast('Paste a link or type a title first');
  const type = $('#addType .on').dataset.v, prio = $('#addPrio .on').dataset.v;
  try {
    const j = await post('/api/add', {text, note: $('#addNote').value, type, prio});
    j.added.forEach(replace);
    closeAdd(); $('#addText').value = ''; $('#addNote').value = '';
    renderAll();
    toast(`Added ${j.added.length} to Unsorted` + (j.skipped.length ? ` · ${j.skipped.length} already in your library` : ''));
  } catch(e) { toast(`Couldn't add: ${e.message}`, true); }
}
$('#addBtn').onclick = openAdd; $('#mscrim').onclick = closeAdd; $('#addCancel').onclick = closeAdd; $('#addSave').onclick = saveAdd;
$('#addText').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) saveAdd(); });

// ---------- shell ----------
let curTab = 'wb';
function renderAll(){ renderWB(); renderPlan(); renderLib(); renderIns(); }
function go(t, keepScroll){
  if (curTab === 'lib' && t !== 'lib') { localStorage.setItem('lpt.seen', TODAY); }
  curTab = t;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === 't-'+t));
  if (!keepScroll) scrollTo(0, 0);
  if (drawerK === null) history.replaceState(null, '', '#' + t);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.tab));
$('#scrim').onclick = closeItem;
$('#q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); if (curTab !== 'lib') go('lib'); renderLib(); });
addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === 'Escape') { if (document.body.classList.contains('md')) closeAdd(); else if (drawerK !== null) closeItem(); else if (typing) document.activeElement.blur(); }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'a' && LIVE) { e.preventDefault(); openAdd(); }
  if (e.key === 's' && LIVE && SAVE.available) { e.preventDefault(); saveAll(); }
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
});
addEventListener('pagehide', () => { flushNotes(); if (curTab === 'lib') localStorage.setItem('lpt.seen', TODAY); });

async function refresh(){
  try {
    const r = await fetch('/api/items', {cache:'no-store'});
    if (!r.ok) return false;
    const j = await r.json();
    if (!j.ok) return false;
    setItems(j.items);
    return true;
  } catch(e) { return false; }
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !LIVE || notesTimer) return;
  const before = TODAY; setToday();
  if (await refresh()) { renderAll(); if (drawerK !== null && K(drawerK)) openItem(drawerK, true); }
  if (before !== TODAY) renderAll();
  saveStatus();
});

(async function boot(){
  setItems(RAW);
  LIVE = location.protocol.startsWith('http') && await refresh();
  document.body.classList.toggle('ro', !LIVE);
  renderAll();
  if (LIVE) saveStatus();
  route();
  addEventListener('hashchange', route);
})();
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (['wb','plan','lib','ins'].includes(h)) { if (drawerK !== null) closeItem(); go(h); }
  else if (h.startsWith('item=')) { const it = items.find(i => i.id === h.slice(5)); if (it && drawerK !== it.k) openItem(it.k); }
}
</script>
</body>
</html>
