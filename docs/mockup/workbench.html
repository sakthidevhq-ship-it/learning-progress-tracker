<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workbench</title>
<style>
:root{
  --bg:#0e1013;--bg2:#13161b;--panel:#171a20;--panel2:#1c2027;--line:#262b33;--line2:#323843;
  --tx:#e8eaed;--tx2:#a3a9b3;--tx3:#6c737e;--acc:#e9c46a;--ok:#5fcf8f;--warn:#e9a15a;--bad:#e06c6c;
  --r:10px;--sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;--serif:"Iowan Old Style","Charter",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
/* header */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:28px;height:58px;padding:0 28px;background:rgba(14,16,19,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:600 15px var(--sans);letter-spacing:.01em}
.brand i{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--acc),#c98a3a);display:inline-block}
nav{display:flex;gap:4px;height:100%}
nav button{background:none;border:0;padding:0 14px;height:100%;color:var(--tx2);font-weight:500;position:relative;display:flex;align-items:center;gap:8px}
nav button:hover{color:var(--tx)}
nav button.on{color:var(--tx)}
nav button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--acc);border-radius:2px}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--panel2);color:var(--tx2)}
.badge.new{background:rgba(233,196,106,.16);color:var(--acc)}
.hsp{flex:1}
.search{display:flex;align-items:center;gap:8px;width:280px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--tx3);font-size:13px}
.search kbd,.k{font:11px var(--sans);border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--tx3);margin-left:auto}
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#4a5260}
.btn.pri{background:var(--acc);color:#1b1608;border-color:transparent;font-weight:600}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.ghost{background:none;border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{color:var(--tx);background:var(--panel)}
main{max-width:1280px;margin:0 auto;padding:30px 28px 80px}
.tab{display:none}.tab.on{display:block}
h1{font:400 30px/1.15 var(--serif);margin:0;letter-spacing:-.01em}
h2{font:600 11.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin:0 0 12px;display:flex;align-items:center;gap:10px}
h2 .c{color:var(--tx2);letter-spacing:0}
h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--tx3)}
.sub{color:var(--tx2);margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--c,#888)}
.chip{white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--tx2)}
.chip.project{color:#9fd1ff;border-color:rgba(159,209,255,.35)}
.chip.practice{color:#c9a7ff;border-color:rgba(201,167,255,.35)}
.muted{color:var(--tx3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
/* workbench */
.wbhead{display:flex;align-items:flex-end;gap:20px;margin-bottom:28px}
.wbhead .stats{margin-left:auto;display:flex;gap:28px}
.stat b{display:block;font:500 22px var(--sans)}.stat span{font-size:12px;color:var(--tx3)}
.wbgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px}
.picked{display:flex;flex-direction:column;gap:10px}
.pc{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;border-left:3px solid var(--c)}
.pc .where{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2)}
.pc .ttl{font:500 16px/1.35 var(--sans);grid-column:1;cursor:pointer}
.pc .ttl:hover{text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.pc .meta{grid-column:1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--tx3)}
.pc .age{grid-column:2;grid-row:1/3;text-align:right;align-self:start}
.pc .age b{font:500 20px var(--sans);display:block}.pc .age span{font-size:11.5px;color:var(--tx3)}
.pc .age.stale b{color:var(--warn)}
.pc .acts{grid-column:2;display:flex;gap:6px;justify-content:flex-end}
.side .card{padding:16px 18px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.row .t:hover{color:#fff}
.planbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--panel2);margin:6px 0 4px}
.planbar i{display:block}
.libcard{display:flex;align-items:center;gap:14px;cursor:pointer}
.libcard:hover{border-color:var(--line2)}
.lastlog{grid-column:1;font-size:13px;color:var(--tx2);margin-top:4px;padding:7px 10px;background:var(--bg2);border-radius:7px;border:1px solid var(--line)}
.pc .acts{grid-row:4}
.logbtn{border-color:rgba(233,196,106,.45);color:var(--acc)}
.logbox{grid-column:1/-1;margin-top:10px;padding:14px;border-radius:9px;background:var(--bg2);border:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:12px}.lrow .lbl{width:44px;font-size:12px;color:var(--tx3)}.lrow .inp{margin:0;height:34px;font-size:13px;flex:1}
.weeks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:20px 10px 16px;margin-bottom:30px}
.wk{display:flex;flex-direction:column;align-items:center;padding:0 10px;border-left:1px solid var(--line)}.wk:first-child{border-left:0}
.wk .hh{font:500 15px var(--sans);margin-bottom:8px}
.wk .col{height:150px;width:34px;display:flex;flex-direction:column-reverse;gap:2px;background:linear-gradient(var(--panel2),var(--panel2)) bottom/100% 1px no-repeat}
.wk .col i{display:block;border-radius:3px;min-height:3px}
.wk .wl{font-size:12px;color:var(--tx3);margin-top:10px}.wk.cur .wl{color:var(--acc)}
.wk .wd{display:flex;flex-direction:column;gap:3px;margin-top:10px;min-height:20px;width:100%;text-align:center}
.wk .wd span{font-size:11.5px;color:var(--ok);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow{display:grid;grid-template-columns:minmax(0,1fr) 170px 64px 70px;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.arow.head{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);border-top:0;padding-top:0}
.tb{display:flex;align-items:center;gap:8px}.tb i{display:block;height:6px;border-radius:3px}.tb em{white-space:nowrap;font-style:normal;font-size:12.5px;color:var(--tx2)}
.psec{padding:16px 18px;margin-bottom:16px}
.leftover{border-color:#4a4330;background:rgba(233,196,106,.035)}
.prow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.psec h2+.prow{border-top:0}
.pt{flex:1;min-width:0}.pt .t{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pt .t:hover{color:#fff}
.ps{font-size:12px;color:var(--tx3);margin-top:2px}
.pa{display:flex;gap:6px}
.fit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fit div{padding:10px 12px;border-radius:8px;background:var(--bg2)}
.fit b{display:block;font:500 22px var(--sans)}.fit span{font-size:11.5px;color:var(--tx3)}.fit .now{outline:1px solid rgba(233,196,106,.4)}.fit .now b{color:var(--acc)}
.insights{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px}
.ins{padding:16px 18px;font-size:14.5px;line-height:1.5;color:var(--tx2)}.ins b{color:var(--tx);font-weight:600}
.ins2{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px}
.lb{width:34px;height:3px;border-radius:2px;background:var(--panel2);margin-top:8px;overflow:hidden}.lb i{display:block;height:100%;background:var(--ok)}
.lbk{display:inline-block;width:14px;height:3px;background:var(--ok);border-radius:2px}
.lg{display:none}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}.split i{display:block}
.splitl{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--tx2)}.splitl b{color:var(--tx);font-weight:600}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 70px 260px 70px 80px;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.drow.head{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);border-top:0}
.drow.dim{color:var(--tx3)}
.fdots{display:flex;gap:3px}.fdots i{width:14px;height:5px;border-radius:2px;background:var(--panel2)}.fdots i.on{background:var(--acc)}
@media (max-width:820px){
  header{height:52px;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}.search{display:none}
  nav{position:fixed;left:0;right:0;bottom:0;height:auto;z-index:25;background:rgba(19,22,27,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line2);padding:4px 4px calc(6px + env(safe-area-inset-bottom));gap:0}
  nav button{flex:1;flex-direction:column;justify-content:center;gap:3px;height:52px;padding:0;font-size:12px}
  nav button.on::after{top:-5px;bottom:auto;left:30%;right:30%}
  nav .badge{position:absolute;top:4px;right:calc(50% - 30px);font-size:9.5px;padding:0 5px}nav .badge.new{display:none}
  main{padding-bottom:90px!important}.toast{bottom:84px}
  #addBtn .al,#addBtn .k{display:none}#addBtn{width:36px;justify-content:center;padding:0;font-size:18px}
  h1{font-size:25px}.wbhead{margin-bottom:18px}
  .pc{padding:13px 14px}.pc .age{display:none}.pc .acts{position:absolute;right:12px;top:12px}.pc{position:relative}.pc .where{padding-right:64px}
  .item{grid-template-columns:20px minmax(0,1fr) auto;padding:9px 4px}.item .dt,.item .plc{display:none}.item .pp.none{display:none}
  .libtools{flex-wrap:wrap}.libtools .hsp,.libtools>span{display:none}.ahead .bar{display:none}.ahead h3{font-size:18px}
  .unsorted{padding:12px}
  .prow{flex-wrap:nowrap}.prow .btn{display:none}.ps{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side .row .btn.ghost{display:none}
  .weeks{padding:14px 2px}.wk{padding:0 3px}.wk .col{width:22px;height:110px}.wk .wd{display:none}.wk .hh{font-size:12px}.wk .wl{font-size:10.5px}
  .tbox .tbtns .btn{padding:0 12px}
  .drawer{padding:20px 16px}.drawer h1{font-size:22px}
  .insights,.ins2{grid-template-columns:minmax(0,1fr)}.drow{grid-template-columns:minmax(0,1fr) 50px 120px}.drow>span:nth-child(4),.drow>span:nth-child(5){display:none}.prow{flex-wrap:wrap}}
.steps{grid-column:1;margin-top:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg2)}
.next{display:flex;align-items:center;gap:10px;padding:8px 11px;cursor:pointer;font-size:13.5px}
.next .nl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.next .nt{flex:1;min-width:0}.next .sc{font-size:12px;color:var(--tx3);white-space:nowrap}
.slist{border-top:1px solid var(--line);padding:6px 11px 10px}
.step{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;cursor:pointer}
.step input{accent-color:var(--ok);width:14px;height:14px;margin:0}
.step.done span{color:var(--tx3);text-decoration:line-through;text-decoration-color:var(--line2)}
.step em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--tx3)}
.addstep .inp{height:32px;font-size:12.5px;margin:6px 0 0;background:transparent;border-style:dashed}
.lrow.top{align-items:flex-start}.lrow.top .lbl{padding-top:5px}
.ticks{display:flex;flex-direction:column}
.modal.today{width:720px;top:6vh;max-height:88vh;display:flex;flex-direction:column;padding:22px 24px 16px;outline:none}
.modal.today .tdl{overflow:auto;min-height:0;flex:1;padding-right:4px}
.modal.today .mfoot{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
body.td #today{opacity:1;pointer-events:auto;transform:translateX(-50%)}body.td #tscrim{opacity:1;pointer-events:auto}
.tdh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.tdl{display:flex;flex-direction:column;gap:10px}
.tdi{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.tdi.on{border-color:rgba(233,196,106,.4)}
.tdt{display:flex;align-items:center;gap:9px;font-weight:500;min-width:0}.tdt .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdn{font-weight:400;font-size:12px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.work{border:1px solid var(--line2);border-radius:12px;padding:16px;margin:4px 0 22px;background:var(--panel)}
.tbox{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 18px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tbox .tl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.tbox .tv{font:500 28px var(--sans);color:var(--acc)}
.tbox .tbtns{display:flex;gap:8px;justify-content:flex-end}.tbox .tbtns .btn{height:38px;padding:0 16px;font-size:14px}.tbox .tbtns .btn:disabled{opacity:.35;cursor:default}
.tbox .tt{grid-column:1/-1;font-size:12.5px}
.wl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:6px 0 8px;display:flex;gap:8px}
.notes{width:100%;min-height:110px;resize:vertical;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;color:var(--tx);font:13.5px/1.55 var(--sans);margin-bottom:12px}
.notes:focus{outline:0;border-color:var(--acc)}
.ck{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:6px;font-size:13.5px}
.ck:hover{background:var(--panel2)}.ck input{accent-color:var(--ok);width:15px;height:15px;margin:0}.ck span{flex:1;cursor:pointer}
.ck.done span{color:var(--tx3);text-decoration:line-through;text-decoration-color:var(--line2)}
.x2{background:none;border:0;color:var(--tx3);opacity:0;font-size:11px}.ck:hover .x2{opacity:1}
.addck{height:34px;font-size:13px;margin:6px 0 0;background:transparent;border-style:dashed}
.pc{cursor:pointer}.pc:hover{border-color:var(--line2)}
.pp{font-size:11.5px;font-weight:600;border:1px solid var(--line2);background:none;border-radius:6px;padding:2px 8px;white-space:nowrap}
.pp.none{color:var(--tx3);border-style:dashed;font-weight:500}.pp.now{color:var(--acc);border-color:rgba(233,196,106,.4)}.pp.soon{color:#9fd1ff;border-color:rgba(159,209,255,.35)}.pp.someday{color:var(--tx2)}
.item .pp.none,.prow .pp.none,.acts2 .pp.none{opacity:.0}.item:hover .pp.none,.prow:hover .pp.none,.acts2:hover .pp.none{opacity:1}
.acts2 .pp.none{opacity:.6}
.plc{display:flex;justify-content:flex-end}.pls{display:flex;gap:4px;opacity:0}.item:hover .pls{opacity:1}
.inpl{font-size:11.5px;color:var(--acc);font-weight:500}
.from{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:#c9b27a;border:1px solid #4a4330;border-radius:5px;padding:1px 6px;margin-left:4px}
.gl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:14px 0 2px}
.psec h2+.gl{margin-top:4px}
.acts2{align-items:center}
/* library */
.libgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px}
.areas{position:sticky;top:88px;align-self:start}
.ar{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px}
.ar:hover,.ar.on{background:var(--panel)}
.ar .n{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px}
.ar .n em{margin-left:auto;font-style:normal;font-size:12px;color:var(--tx3)}
.bar{height:4px;border-radius:2px;background:var(--panel2);margin-top:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.libtools{display:flex;gap:8px;align-items:center;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 11px;font-size:12.5px;color:var(--tx2)}
.seg button.on{background:var(--panel2);color:var(--tx)}
.unsorted{padding:14px 18px;margin-bottom:26px;border-style:dashed;border-color:#4a4330;background:rgba(233,196,106,.04)}
.asec{margin-bottom:30px}
.ahead{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line2);margin-bottom:4px}
.ahead h3{margin:0;font:400 21px var(--serif)}
.ahead .cov{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--tx2)}
.ahead .bar{width:160px;margin:0;height:6px}
.topic{margin-top:14px}
.th{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--tx2);margin-bottom:4px;font-weight:500}
.th .mini{width:60px;height:3px;margin:0}
.item{display:grid;grid-template-columns:22px minmax(0,1fr) 92px 96px 150px;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer}
.item:hover{background:var(--panel)}
.item .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.done .tt{color:var(--tx3)}
.item .ty,.item .dt{font-size:12px;color:var(--tx3)}
.st{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2)}
.st.picked{border-color:var(--warn);background:radial-gradient(circle,var(--warn) 0 3px,transparent 3.5px)}
.st.done{border-color:var(--ok);background:var(--ok)}
.st.dropped{border-color:var(--tx3);background:linear-gradient(45deg,transparent 45%,var(--tx3) 45% 55%,transparent 55%)}
.pr{font-size:11.5px;font-weight:600}
.pr.now{color:var(--acc)}.pr.soon{color:#9fd1ff}.pr.someday{color:var(--tx3)}
.newtag{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--acc)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;z-index:31;background:var(--bg2);border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:26px 28px}
body.dr .scrim{opacity:1;pointer-events:auto}body.dr .drawer{transform:none}
.drawer .x{position:absolute;right:18px;top:18px}
.drawer h1{font-size:26px;margin:10px 0 12px;padding-right:30px}
.drawer p{color:var(--tx2);margin:0 0 18px}
.dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px;margin:18px 0}
.dl dt{color:var(--tx3)}.dl dd{margin:0}
.timeline{display:flex;gap:0;margin:18px 0 22px;font-size:12px}
.timeline div{flex:1;padding-top:10px;border-top:2px solid var(--line2);color:var(--tx3)}
.timeline div.on{border-color:var(--acc);color:var(--tx)}
.timeline b{display:block;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.acts2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.sim{margin-top:6px}
.sim .row .t{font-size:13.5px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--tx2);font-style:italic;margin-bottom:16px}
/* review */
.rvhead{display:flex;align-items:flex-end;gap:20px;margin-bottom:22px}
.rvhead .r{margin-left:auto;display:flex;gap:8px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:28px}
.strip div{background:var(--panel);padding:16px 18px}
.strip b{font:500 26px var(--sans);display:flex;align-items:center;gap:10px}
.strip span{font-size:12px;color:var(--tx3)}
.grid6{width:100%;border-collapse:collapse;margin-bottom:10px;table-layout:fixed}
.grid6 th{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);text-align:left;padding:0 8px 10px}
.grid6 th small{display:block;font-weight:500;letter-spacing:0;text-transform:none;color:var(--tx3);font-size:11px;margin-top:2px}
.grid6 td{border-top:1px solid var(--line);padding:9px 8px;vertical-align:middle;height:44px}
.grid6 td.a{width:200px;font-weight:500;white-space:nowrap}
.grid6 td.a .dot{margin-right:8px}
.ev{display:flex;flex-wrap:wrap;gap:4px}
.g{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:default;position:relative}
.g.collected{border:1.5px dashed var(--tx3);color:var(--tx3)}
.g.collected::after{content:"+"}
.g.picked{border:1.5px solid var(--warn);background:radial-gradient(circle,var(--warn) 0 3px,transparent 3.5px)}
.g.done{background:var(--ok)}
.g.dropped{border:1.5px solid var(--tx3);color:var(--tx3)}
.g.dropped::after{content:"×";font-size:12px}
.cur{background:rgba(233,196,106,.035)}
.legend{display:flex;gap:18px;font-size:12px;color:var(--tx3);margin:10px 0 0}
.legend span{display:flex;align-items:center;gap:6px}
.rv2{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:34px}
.mv{display:grid;grid-template-columns:minmax(0,1fr) 140px 90px;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.mv:first-of-type{border-top:0}
.mv .bars{position:relative;height:6px;border-radius:3px;background:var(--panel2)}
.mv .bars i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.mv .d{text-align:right;color:var(--tx2);font-size:12.5px}
.mv .d b{color:var(--ok);font-weight:600}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.out{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;width:96px;text-align:right;white-space:nowrap}
.out.done{color:var(--ok)}.out.picked{color:var(--warn)}.out.collected{color:var(--tx3)}.out.dropped{color:var(--tx3)}
.pick{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
/* modal */
.modal{position:fixed;left:50%;top:16vh;transform:translateX(-50%) scale(.98);width:520px;z-index:41;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:22px 24px;opacity:0;pointer-events:none;transition:.18s;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.mscrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.18s}
body.md .modal{opacity:1;pointer-events:auto;transform:translateX(-50%)}body.md .mscrim{opacity:1;pointer-events:auto}
.inp{width:100%;height:42px;border:1px solid var(--line2);background:var(--bg);border-radius:8px;padding:0 12px;color:var(--tx);font:15px var(--sans);margin-bottom:10px}
.inp:focus{outline:0;border-color:var(--acc)}
.hintline{font-size:12.5px;color:var(--tx3);margin-top:12px}
.mfoot{display:flex;align-items:center;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line2);padding:10px 16px;border-radius:9px;font-size:13px;opacity:0;transition:.2s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:820px){
  header{gap:6px;padding:0 10px}#addBtn .k{display:none}#addBtn{padding:0 10px}.search{display:none}nav button{padding:0 9px}
  main{padding:20px 14px 60px}
  .wbhead{flex-direction:column;align-items:flex-start}.wbhead .stats{margin-left:0;gap:20px}
  .wbgrid,.libgrid,.rv2,.plan{grid-template-columns:minmax(0,1fr)}.ttl,.pc .where{min-width:0;overflow-wrap:anywhere}
  .areas{position:static;display:none}
  .item{grid-template-columns:22px minmax(0,1fr) 44px}.item .ty,.item .dt,.item .pr{display:none}
  .pc{grid-template-columns:minmax(0,1fr)}.pc .age{grid-column:1;grid-row:auto;text-align:left;display:flex;gap:8px;align-items:baseline}.pc .age b{display:inline;font-size:14px}.pc .acts{grid-column:1;grid-row:auto;justify-content:flex-start}
  .strip{grid-template-columns:repeat(2,1fr)}.grid6 td.a{width:auto}.grid6{font-size:12px}
  .drawer{width:100%}.modal{width:calc(100% - 24px);top:10vh}
}
</style>
</head>

ct/poll/epoll, non-blocking I/O, and building a simple HTTP server. Practical C code throughout."}, {"t": "Build a Large Language Model (From Scratch)", "ty": "docs", "d": "ML/Foundations", "tp": "Neural Networks", "c": ["Tokenization", "Self-Attention", "Transformer Architecture", "Pretraining", "Fine-Tuning"], "src": "https://www.manning.com/books/build-a-large-language-model-from-scratch", "sz": "deep-dive", "sum": "Sebastian Raschka's book walking through the full implementation of a GPT-style LLM in PyTorch, covering tokenization, attention, transformer blocks, pretraining, and fine-tuning for classification and instruction-following."}, {"t": "Build a Reasoning Model (From Scratch)", "ty": "docs", "d": "ML/Infrastructure", "tp": "Model Architecture", "c": ["Chain-of-Thought", "Reinforcement Learning Basics", "LLM Basics", "Transformer Architecture"], "src": "https://www.manning.com/books/build-a-reasoning-model-from-scratch", "sz": "deep-dive", "sum": "Sebastian Raschka's follow-up book focused on implementing reasoning-capable language models from scratch, covering techniques like chain-of-thought training, reinforcement learning for reasoning, and inference-time compute scaling."}, {"t": "CRDTs and Optimistic Replication", "ty": "paper", "d": "Systems", "tp": "Distributed Replication", "c": ["CRDTs", "Eventual Consistency", "Conflict Resolution", "Causal Consistency", "Optimistic Replication", "Vector Clocks"], "src": "/private/tmp/crdt.md", "sz": "deep-dive", "sum": "Convergent and Commutative Replicated Data Types (CRDTs) \u2014 data structures that can be replicated across nodes and updated independently, with mathematical guarantees of eventual convergence without coordination. Covers G-Counters, PN-Counters, OR-Sets, LWW-Re"}, {"t": "CSAPP \u2014 Computer Systems: A Programmer's Perspective", "ty": "docs", "d": "Systems", "tp": "Computer Architecture", "c": ["Memory Hierarchy", "Cache Architecture", "Virtual Memory", "x86-64 Assembly", "Linking", "Exceptional Control Flow", "Concurrency"], "src": "/private/tmp/csapp.md", "sz": "deep-dive", "sum": "CMU's comprehensive systems textbook covering the entire stack a programmer interacts with: data representation, machine-level programming (x86-64), processor architecture, memory hierarchy (caches, virtual memory), linking, exceptional control flow, system-le"}, {"t": "Compression = Prediction \u2014 Personal Notes", "ty": "docs", "d": "Systems", "tp": "Compression", "c": ["Information Theory", "Prediction-Compression Duality", "Multi-Algorithm Compression", "GPU Memory Bandwidth", "Quantization", "KV Cache", "Hardware Sparsity"], "src": "/private/tmp/compression-notes.md", "sz": "quick-read", "sum": "Personal brainstorm connecting compression theory to LLMs and GPU architecture. Core insight: prediction and compression are mathematically equivalent \u2014 better prediction means fewer bits. Explores multi-algorithm compression (already used in HTTP, PNG, video "}, {"t": "Context Engineering for AI Agents", "ty": "docs", "d": "ML/Agents", "tp": "Context Engineering", "c": ["Context Compaction", "Token Management", "System Prompts", "Tool Results Pruning", "Agent Architecture"], "src": "unknown", "sz": "medium", "sum": "Anthropic engineering guide on effective context management for AI agents. Covers context compaction strategies, token optimization, system prompt design, and intelligent tool result pruning to maximize agent capabilities within token limits."}, {"t": "Crafting Interpreters", "ty": "docs", "d": "Programming/Compilers", "tp": "Language Implementation", "c": ["Lexing", "Parsing", "AST", "Bytecode", "Virtual Machine", "Garbage Collection", "Closures"], "src": "https://craftinginterpreters.com", "sz": "deep-dive", "sum": "Bob Nystrom's guide to building two complete interpreters: a tree-walk interpreter in Java (jlox) and a bytecode VM in C (clox). Covers scanning, parsing, name resolution, control flow, functions, closures, classes, inheritance, and garbage ], "src": "https://www.deeplearningbook.org/contents/generative_models.html", "sz": "deep-dive", "sum": "Chapters 13-20: the research frontier as of the book \u2014 linear factor models, autoencoders, representation learning, structured probabilistic models, Monte Carlo methods, the partition function, approximate inference, and deep generative models (Boltzmann machi"}, {"t": "DeepSeek-V3 Technical Report", "ty": "paper", "d": "ML/Infrastructure", "tp": "Model Architecture", "c": ["Mixture of Experts", "KV Cache", "Multi-Head Attention", "Transformer Architecture"], "src": "https://arxiv.org/abs/2412.19437", "sz": "deep-dive", "sum": "DeepSeek-V3 is a 671B-parameter (37B active) mixture-of-experts language model that introduces Multi-head Latent Attention for KV cache compression and multi-token prediction as an auxiliary training objective, achieving strong performance at relatively low tr"}, {"t": "Designing Data-Intensive Applications", "ty": "docs", "d": "Systems", "tp": "Distributed Systems", "c": ["Replication", "Partitioning", "Consistency Models", "Stream Processing", "Batch Processing", "Storage Engines", "Transactions"], "src": "https://dataintensive.net", "sz": "deep-dive", "sum": "Martin Kleppmann's comprehensive guide to the principles and practices behind reliable, scalable, and maintainable data systems. Covers data models, storage engines, encoding, replication, partitioning, transactions, consistency, batch/stream processing, and t"}, {"t": "Direct Preference Optimization: Your Language Model is Secretly a Reward Model", "ty": "paper", "d": "ML/Foundations", "tp": "RLHF", "c": ["Direct Preference Optimization", "RLHF", "Reward Models"], "src": "https://arxiv.org/abs/2305.18290", "sz": "medium", "sum": "The DPO paper shows that the RLHF objective can be reformulated as a simple classification loss directly over a language model's policy, eliminating the need for a separate reward model and unstable RL training like PPO."}, {"t": "Distil-Whisper: Rob  "sum": "Philosophy of building responsive software systems with tight latency budgets. Discusses techniques for maintaining system responsiveness, managing latency budgets, and designing for fast user feedback loops."}, {"t": "How to Think Step-by-Step: A Mechanistic Understanding of Chain-of-Thought Reasoning", "ty": "paper", "d": "ML/Foundations", "tp": "Interpretability", "c": ["Mechanistic Interpretability", "Chain of Thought", "Activation Probing", "Attention Head Analysis", "Circuit Analysis", "Reasoning Decomposition"], "src": "https://arxiv.org/abs/2402.18312", "sz": "deep-dive", "sum": "Mechanistic interpretability study of how LLMs actually perform chain-of-thought reasoning. Probes internal activations during multi-step fictional-ontology reasoning to locate where and how the model decomposes tasks, finding that CoT emerges from parallel pr"}, {"t": "Hugging Face YouTube \u2014 ML Tutorials and Demos", "ty": "video", "d": "ML/Foundations", "tp": "Model Architecture", "c": ["Transformer Architecture", "Fine-Tuning", "Quantization", "Diffusion Models", "Model Hub"], "src": "https://www.youtube.com/@HuggingFace/videos", "sz": "deep-dive", "sum": "Hugging Face's official YouTube channel covering transformers, diffusion models, fine-tuning, RLHF, quantization, inference optimization, and new model releases. Mix of deep technical talks, hands-on tutorials, and community demos. Good for staying current on "}, {"t": "Kafka, ZooKeeper, and Distributed Coordination", "ty": "paper", "d": "Systems", "tp": "Streaming", "c": ["Log-Structured Storage", "Atomic Broadcast", "Distributed Coordination", "Consumer Groups", "Partition Leadership", "Event Sourcing"], "src": "/private/tmp/kafka-dist.md", "sz": "deep-dive", "sum": "The distributed systems infrastructure stack: Kafka's log-based message broker with ZooKeeper's atomic broadcast protocol (Zab), Omega's flexible cluster scheduling, and Thialfi's client notification service. Covers how these systems achieve high-throughput, f"}, {"t": "KataGo \u2014 Accelerating Self-Play Learning in Go", "ty": "paper", "d": "Game AI", "tp": "Self-Play Systems", "c": ["Self-Play Acceleration", "Auxiliary Training Targets", "Data Augmentation", "Training Efficiency"], "src": "https://arxiv.org/abs/1902.10565", "sz": "medium", "sum": "The paper behind KataGo's training innovations. Shows how auxiliary training targets, game outcome prediction, and various data augmentation techniques can accelerate self-play training by 50x compared to AlphaZero-style approaches."}, {"t": "KataGo \u2014 Architecture & Methods", "ty": "docs", "d": "Game AI", "tp": "Self-Play Systems", "c": ["Monte Carlo Tree Search", "Auxiliary Training Targets", "Ownership Prediction", "Playout Cap Randomization", "Self-Play Efficiency"], "src": "https://github.com/lightvector/KataGo", "sz": "deep-dive", "sum": "Deep dive into KataGo, one of the strongest open-source Go engines. The KataGoMethods.md document explains innovations: auxiliary policy targets, ownership prediction, dynamic komi, playout cap randomization. Achieves superhuman play with 50x less compute than"}, {"t": "Kha Vo \u2014 Hungry Geese & Kore Competition Retrospectives", "ty": "article", "d": "Game AI", "tp": "Competition Strategy", "c": ["Reward Shaping", "Rule-Based vs Learned Agents", "Competition Meta-Strategy", "Multi-Agent Training"], "src": "https://kaggle.com/khahuras", "sz": "medium", "sum": "Solution writeups from top Kaggle competitor covering Hungry Geese and Kore 2022. Discusses rule-based vs learned approaches, reward shaping for RL agents, and practical tricks for game AI competitions."}, {"t": "Lamport Clocks and Causal Ordering", "ty": "paper", "d": "Systems", "tp": "Distributed Systems", "c": ["Lamport Clocks", "Happens-Before Relation", "Logical Clocks", "Causal Ordering", "Total Ordering", "Vector Clocks"], "src": "/private/tmp/lamport-clocks.md", "sz": "medium", "sum": "Lamport's foundational 'Time, Clocks, and the Ordering of Events in a raining at scale, supervised fine-tuning, RLHF with rejection sampling, Ghost Attention for multi-turn consistency, and safety evaluation. Trained on 2T tokens with context length of 4096."}, {"t": "Mamba - Linear-Time Sequence Modeling", "ty": "paper", "d": "ML/Infrastructure", "tp": "Model Architecture", "c": ["State Space Models", "Selective Scan", "Linear Attention", "Hardware-Aware Design", "Sequence Modeling"], "src": "https://arxiv.org/abs/2402.17764", "sz": "medium", "sum": "Introduces Mamba, a selective state space model that matches Transformer quality while scaling linearly with sequence length. Replaces attention with a hardware-aware selective scan algorithm. Shows strong results on language, audio, and genomics."}, {"t": "Math Foundations for Machine Learning", "ty": "docs", "d": "ML/Foundations", "tp": "Mathematics", "c": ["Calculus", "Linear Algebra", "Probability", "Gradient Descent", "Computational Graphs"], "src": "https://github.com/ml-curriculum/math-foundations", "sz": "medium", "sum": "A curriculum module reviewing the calculus, linear algebra, and probability needed to understand ML algorithms, including gradients, matrix operations, and computational graphs for automatic differentiation."}, {"t": "Matryoshka Representation Learning", "ty": "paper", "d": "ML/Foundations", "tp": "Representation Learning", "c": ["Matryoshka Embeddings", "Nested Representations", "Adaptive Retrieval", "Embedding Truncation", "Coarse-to-Fine Search", "Representation Learning"], "src": "https://arxiv.org/abs/2205.13147", "sz": "medium", "sum": "Introduces Matryoshka Representation Learning (MRL): training embeddings so that nested prefixes of a single vector are themselves valid, high-quality representations at multiple granularities \u2014 like nesting dolls. One 2048-d embedding contains usable 8, 16, ."}, {"t": "Microservices vs Monolith \u2014 Architecture Patterns", "ty": "docs", "d": "Systems", "tp": "Architecture", "c": ["Microservices", "Monolith Architecture", "Service Boundaries", "API Design", "Event-Driven Architecture"], "src": "/private/tmp/microservices.md", "sz": "medium", "sum": "Survey of microservice and monolith architecture patterns. Covers Martin Fowler's definition, Netflix's migration journey, the 'monolith first' approach, communication patterns (sync REST, async messaging), and practical questions to ask before splitting servi"}, {"t": "Mixtral - Sparse Mixture of Experts", "ty": "paper", "d": "ML/Infrastructure", "tp": "Inference Optimization", "c": ["Sparse MoE", "Expert Routing", "Load Balancing", "Top-K Gating", "Expert Specialization"], "src": "https://arxiv.org/abs/2312.10997", "sz": "medium", "sum": "Mistral AI's Mixtral 8x7B model using sparse Mixture of Experts. Each token is routed to 2 of 8 expert FFN layers, achieving quality matching Llama 2 70B at 6x lower inference cost. Covers routing, load balancing, and expert specialization."}, {"t": "Moshi: A Speech-Text Foundation Model for Real-Time Dialogue", "ty": "paper", "d": "ML/Voice", "tp": "Speech Models", "c": ["Streaming Speech Models", "Neural Audio Codec", "Inner Monologue", "Transformer Architecture"], "src": "https://arxiv.org/abs/2410.00037", "sz": "deep-dive", "sum": "The Moshi paper introduces a full-duplex spoken dialogue model that jointly models an inner text monologue alongside audio tokens from a neural codec, enabling low-latency, natural-sounding real-time conversation without a separate ASR/TTS pipeline."}, {"t": "NLP and Attention Mechanisms", "ty": "docs", "d": "ML/Foundations", "tp": "NLP", "c": ["Tokenization", "Word Embeddings", "N-gram Models", "Attention Mechanisms", "Encoder-Decoder Architecture"], "src": "https://github.com/ml-curriculum/nlp-attention", "sz": "medium", "sum": "A curriculum module tracing the evolution of NLP techniques from tokenization and n-gram models through word embeddings to early attention mechanisms like Bahdanau and Luong attention in encoder-decoder architectures."}, {"t": "Nand2Tetri ion with tokenization."}, {"t": "Noam Brown \u2014 AI for Imperfect-Information Games (Pluribus Talk)", "ty": "video", "d": "Game AI", "tp": "Imperfect Information Games", "c": ["Counterfactual Regret Minimization", "Nash Equilibrium", "Blueprint Strategy", "Real-Time Search", "Imperfect Information"], "src": "https://youtube.com/noam-brown-pluribus", "sz": "medium", "sum": "Talk on building superhuman poker AI. Covers counterfactual regret minimization (CFR), search in imperfect-information games, blueprint strategies, and real-time search. Key insight: in imperfect info games, you can't just look ahead \u2014 you need to reason about"}, {"t": "Noam Brown \u2014 CICERO: AI for Diplomacy", "ty": "video", "d": "Game AI", "tp": "Imperfect Information Games", "c": ["Strategic Reasoning", "Natural Language Negotiation", "Planning with LLMs", "Intent Prediction", "Cooperative-Competitive Games"], "src": "https://youtube.com/noam-brown-cicero", "sz": "medium", "sum": "Talk on CICERO, the first AI to achieve human-level play in Diplomacy \u2014 a game requiring natural language negotiation. Bridges game AI and LLM reasoning: uses a language model for dialogue and a planning algorithm for strategy. Shows how LLMs can ground reason"}, {"t": "Non-Obvious Things About GEPA", "ty": "article", "d": "ML/Frameworks", "tp": "Prompt Optimization", "c": ["Prompt Optimization", "Validation Composition", "Test-Driven Prompting"], "src": "unknown", "sz": "medium", "sum": "Exploration of validation composition and per-example frontiers in test-driven prompt optimization. Discusses how to structure prompt optimization as a composition of validators and leverage test-driven approaches to find better prompts incrementally."}, {"t": "OSTEP - Operating Systems: Three Easy Pieces", "ty": "docs", "d": "Systems", "tp": "Operating Systems", "c": ["Process Scheduling", "Virtual Memory", "Page Tables", "File Systems", "Locks", "Condition Variables", "Context Switching"], "src": "https://pages.cs.wisc.edu/~remzi/OSTEP/", "sz": "deep-dive", "sum": "Free online textbook covering the three core OS concepts: virtualization (processes, address spaces), concurrency (threads, locks, condition variables), and persistence (file systems, devices). Includes homework simulations."}, {"t": "Orphan and Zombie Processes \u2014 How They Consume Resources", "ty": "docs", "d": "Systems", "tp": "Operating Systems", "c": ["Process Lifecycle", "Orphan Processes", "Zombie Processes", "Process Table", "Signal Handling", "Process Groups"], "src": "/private/tmp/orphan.md", "sz": "medium", "sum": "What happens when a parent process dies but its children keep running. Covers Unix process lifecycle (fork, exec, wait, exit), how orphans get reparented to init/launchd, how zombies retain PIDs and entries in the process table, why orphaned language servers a"}, {"t": "Paxos \u2014 Consensus Papers Collection", "ty": "paper", "d": "Systems", "tp": "Distributed Consensus", "c": ["Paxos Consensus", "Multi-Paxos", "Quorum", "Proposer-Acceptor-Learner", "FLP Impossibility", "Partial Synchrony"], "src": "/private/tmp/paxos.md", "sz": "deep-dive", "sum": "The family of Paxos consensus papers: Lamport's 'The Part-Time Parliament' (original), 'Paxos Made Simple' (accessible rewrite), 'Paxos Made Live' (Google's engineering experience), and 'Paxos Made Practical'. Covers single-decree Paxos, Multi-Paxos, and the g"}, {"t": "Physics of Language Models: Knowledge Storage and Extraction", "ty": "paper", "d": "ML/Infrastructure", "tp": "Model Architecture", "c": ["Mechanistic Interpretability", "Knowledge Storage", "Transformer Architecture"], "src": "https://arxiv.org/abs/2309.14316", "sz": "medium", "sum": "Part of the Physics of Language Models series, this work uses controlled synthetic experiments to study how transformer language models internally store and retrieve factual knowledge, revealing structure behind memorization and generalization."}, {"t": "Pluribus \u2014 Superhuman AI for Multiplayer Poker", "ty": "paper", "d": "Game AI", "tp": "Imperfect Information Games", "c": ["Monte Carlo CFR", "Depth-Limited Search", "Blueprint Strategy", "Abstraction", "Imperfect Information"], "src": "https://science.org/pluribus-2019", "sz": "deep-dive", "sum": "The Science 2019 paper on Pluribus, the first AI to beat professional poker players in 6-player no-limit Texas Hold'em. Introduces depth-limited search in imperfect-information games and a novel blueprint strategy computed via Monte Carlo CFR."}, {"t": "Pokemon TCG Agent - LLM Agentic Approach", "ty": "docs", "d": "Game AI", "tp": "Agentic Systems", "c": ["Game State Representation", "Action Space Design", "Multi-Step Reasoning", "Tool Use", "Agent Memory", "Opponent Modeling"], "src": "https://github.com/pokemon-tcg-llm-agent", "sz": "deep-dive", "sum": "A project exploring building an LLM-powered agent that can play the Pokemon Trading Card Game. Involves game state representation, action space design, multi-step reasoning for card combos, and opponent modeling. Demonstrates practical agentic patterns: tool u"}, {"t": "PostgreSQL Internals \u2014 EXPLAIN, Indexes, and Bloom Filters", "ty": "docs", "d": "Systems", "tp": "Databases", "c": ["Query Planning", "EXPLAIN ANALYZE", "Index Design", "Bloom Filters", "Lateral Joins", "Query Optimization"], "src": "/private/tmp/pg.md", "sz": "deep-dive", "sum": "Deep dive into PostgreSQL internals: reading and visualizing EXPLAIN ANALYZE output, understanding query planner decisions, lateral joins, following a SELECT through Postgres internals, index maintenance strategies, monitoring unused indexes, and using Bloom f"}, {"t": "Process Profiling on macOS", "ty": "docs", "d": "Systems", "tp": "Operating Systems", "c": ["Process Profiling", "Flame Graphs", "dtrace", "Instruments", "CPU Profiling", "Memory Profiling", "System Calls"], "src": "/private/tmp/proc.md", "sz": "medium", "sum": "How to find and diagnose resource-hogging processes on macOS. Covers top, ps, Activity Monitor internals, Instruments.app for CPU/memory profiling, dtrace/dtruss for syscall tracing, sample and spindump for hang diagnosis, and how to read flame graphs. Underst"}, {"t": "Python Design Patterns and Django Best Practices", "ty": "docs", "d": "Programming/Python", "tp": "Design Patterns", "c": ["Design Patterns", "State Machines", "WSGI", "Django Migrations", "Factory Pattern", "Observer Pattern"], "src": "/private/tmp/patterns.md", "sz": "medium", "sum": "Design patterns applied to Python: factory, observer, strategy, state machines (FSM), decorator. Django-specific patterns: WSGI internals, zero-downtime migrations, cached_property, and deployment with Fabric. Understanding how Django serves requests from WSGI"}, {"t": "RLHF Book", "ty": "docs", "d": "ML/Foundations", "tp": "RLHF", "c": ["RLHF", "Reward Models", "PPO", "Direct Preference Optimization", "Post-Training"], "src": "https://rlhfbook.com", "sz": "deep-dive", "sum": "Nathan Lambert's comprehensive book on reinforcement learning from human feedback, covering the full post-training pipeline: reward modeling, PPO, and Direct Preference Optimization as a simpler alternative."}, {"t": "Raft \u2014 In Search of an Understandable Consensus Algorithm", "ty": "paper", "d": "Systems", "tp": "Distributed Consensus", "c": ["Raft Consensus", "Leader Election", "Log Replication", "Replicated State Machine", "Membership Changes", "Log Compaction"], "src": "/private/tmp/raft.md", "sz": "deep-dive", "sum": "The Raft consensus algorithm, designed for understandability. Covers leader election, log replication, safety guarantees, membership changes, and log compaction. The go-to alternative to Paxos for building replicated state machines. Used in etcd, CockroachDB, "}, {"t": "ReAct - Reasoning and Acting in LLMs", "ty": "paper", "d": "ML/Frameworks", "tp": "Prompt Engineering", "c": ["ReAct Pattern", "Chain of Thought", "Tool Use", "Thought-Action-Observation", "Few-Shot Prompting"], "src": "https://arxiv.org/ab items.forEach(i=>{ if ((i.state==='picked'||i.state==='done') && !i.planned) i.planned = i.picked.slice(0,7); });

// ---- model ----
const live = i => i.state !== 'dropped';
const coverageAt = (list, d) => {
  const inSet = list.filter(i => i.ingested <= d && !(i.dropped && i.dropped <= d));

const weekNo = d => { const t = new Date(d); t.setDate(t.getDate()+3-(t.getDay()+6)%7); const w1 = new Date(t.getFullYear(),0,4); return 1+Math.round(((t-w1)/DAY-3+(w1.getDay()+6)%7)/7); };

// ---- insights (six weeks) ----
function renderIns(){
  const from = WEEKS[0].start, to = WEEKS[5].end;
  const S = allSessions().filter(s=>s.d>=from && s.d<=to);
  const H = sum(S.map(s=>s.h));
  const buildH = sum(S.filter(s=>isBuild(s.i)).map(s=>s.h));
  const doneIn = items.filter(i=>i.done && i.done>=from);
  const collIn = items.filter(i=>i.ingested>=from);
  const wk = WEEKS.map(w=>{ const ss=S.filter(s=>s.d>=w.start&&s.d<=w.end); return {w, h:sum(ss.map(s=>s.h)), b:sum(ss.filter(s=>isBuild(s.i)).map(s=>s.h)), byA:groupBy(ss,s=>s.i.area), done:doneIn.filter(i=>i.done>=w.start&&i.done<=w.end)}; });
  const maxH = Math.max(4,...wk.map(x=>x.h));
  const areas = [...new Set([...Object.keys(FOCUS), ...S.map(s=>s.i.area)])].map(a=>{ const ss=S.filter(s=>s.i.area===a), l=items.filter(i=>i.area===a), c=cov(l), c0=coverageAt(l,from); return {a, h:sum(ss.map(s=>s.h)), f:focusOf(a), done:doneIn.filter(i=>i.area===a).length, c, c0}; }).sort((x,y)=>y.f-x.f||y.h-x.h);
  const top = areas.slice().sort((x,y)=>y.h-x.h)[0], topF = areas[0];
  const stalled = items.filter(i=>i.state==='picked' && days(lastWorked(i)||i.picked)>=14);
  const noLog = doneIn.filter(i=>!i.sessions.length).length;
  const pct = x => Math.round(x/H*100);
  const insights = [
    `<b>${pct(top.h)}%</b> of your time went to <b>${esc(short(top.a))}</b>.`,
    topF.a!==top.a ? `<b>${esc(short(topF.a))}</b> is your top career focus and got <b>${pct(topF.h)}%</b> (${fmtH(topF.h)}).` : `Your top career focus also got the most time.`,
    `<b>${pct(buildH)}%</b> was building (projects and practice); the rest was reading and watching.`,
    `You collected <b>${collIn.length}</b> and finished <b>${doneIn.length}</b>. The library grew faster than you finished.`,
  ];
  $('#ins').innerHTML = `
  <div class="rvhead"><div><h1>The last six weeks</h1><div class="sub">${fmt(from)} – ${fmt(to)} · <b style="color:var(--tx)">${fmtH(H)}</b> logged · <b style="color:var(--tx)">${doneIn.length}</b> finished</div></div>
    <div class="r"><div class="seg"><button>◂ Earlier</button><button class="on">6 weeks</button><button>3 months</button></div></div></div>
  <div class="insights">${insights.map(s=>`<div class="card ins">${s}</div>`).join('')}</div>
  <div class="ins2">
    <div>
      <h2>Time per week <span class="r"><span class="lg"><i style="background:#8a94a3"></i>by area</span></span></h2>
      <div class="card weeks">
        ${wk.map((x,k)=>`<div class="wk ${k===5?'cur':''}">
          <div class="hh num">${x.h?fmtH(x.h):'—'}</div>
          <div class="col">${Object.entries(x.byA).map(([a,ss])=>`<i style="height:${sum(ss.map(s=>s.h))/maxH*100}%;background:${col(a)}" title="${esc(short(a))} · ${fmtH(sum(ss.map(s=>s.h)))}"></i>`).join('')}</div>
          <div class="wl">${k===5?'This week':fmt(x.w.start)}</div>
          <div class="lb"><i style="width:${x.h?x.b/x.h*100:0}%"></i></div>
          <div class="wd">${x.done.map(i=>`<span title="${esc(i.title)}">✓ ${esc(i.title.length>20?i.title.slice(0,19)+'…':i.title)}</span>`).join('')}</div>
        </div>`).join('')}
      </div>
      <div class="legend"><span><i class="lbk"></i>green line = share spent building</span><span>✓ finished that week</span></div>
    </div>
    <div>
      <h2>Learning vs building</h2>
      <div class="card" style="padding:18px">
        <div class="split"><i style="flex:${H-buildH};background:#6aa8ff"></i><i style="flex:${buildH};background:var(--ok)"></i></div>
        <div class="splitl"><span><b class="num">${fmtH(H-buildH)}</b> learning · ${100-pct(buildH)}%</span><span><b class="num">${fmtH(buildH)}</b> building · ${pct(buildH)}%</span></div>
        <div class="muted" style="font-size:12.5px;margin-top:12px">Learning = papers, articles, videos, docs. Building = projects and practice.</div>
      </div>
      <h2 style="margin-top:22px">Stalled <span class="c">${stalled.length}</span><span class="r">picked up, no work in 14+ days</span></h2>
      <div class="card" style="padding:4px 16px">${stalled.length?stalled.map(i=>`<div class="row"><span class="dot" style="--c:${col(i.area)}"></span><span class="t" onclick="openItem(${i.id})">${esc(i.title)}</span><span class="muted num" style="font-size:12px">${days(lastWorked(i)||i.picked)}d</span></div>`).join(''):'<div class="row muted">Nothing stalled.</div>'}</div>
    </div>
  </div>
  <h2 style="margin-top:30px">Direction <span class="r">areas ordered by your career focus (config.yaml)</span></h2>
  <div class="card" style="padding:6px 18px 10px">
    <div class="drow head"><span>Area</span><span>Focus</span><span>Share of time</span><span>Finished</span><span>Coverage</span></div>
    ${areas.map(r=>`<div class="drow ${r.h?'':'dim'}"><span><span class="dot" style="--c:${col(r.a)};margin-right:9px"></span>${esc(short(r.a))}</span>
      <span class="fdots">${[.6,.75,.85].map(t=>`<i class="${r.f>=t?'on':''}"></i>`).join('')}</span>
      <span class="tb"><i style="width:${r.h/top.h*100}%;background:${col(r.a)}"></i><em class="num">${r.h?pct(r.h)+'% · '+fmtH(r.h):'no time'}</em></span>
      <span class="num">${r.done||'<span class="muted">—</span>'}</span>
      <span class="num">${r.c.done}/${r.c.total}${r.c.done>r.c0.done?` <span style="color:var(--ok);font-size:12px">+${r.c.done-r.c0.done}</span>`:''}</span></div>`).join('')}
  </div>
  ${noLog?`<div class="muted" style="font-size:12px;margin-top:14px">${noLog} of ${doneIn.length} finished items have no time logged, so the time figures undercount.</div>`:''}`;
}

function renderAll(){ renderWB(); renderLib(); renderPlan(); renderIns(); $('#nPlan').textContent = items.filter(i=>i.planned===MONTH).length; }
function go(t){ document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t)); document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id===t)); scrollTo(0,0); history.replaceState(null,'','#'+t); }
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
$('#scrim').onclick=closeItem;
const openAdd=()=>{document.body.classList.add('md');setTimeout(()=>$('#addUrl').focus(),50)}, closeAdd=()=>document.body.classList.remove('md');
$('#addBtn').onclick=openAdd; $('#mscrim').onclick=closeAdd; $('#addCancel').onclick=closeAdd;
document.querySelectorAll('#addType button,#addPrio button').forEach(b=>b.onclick=()=>{[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b))});
$('#addSave').onclick=()=>{ const lines=$('#addUrl').value.split('\n').map(s=>s.trim()).filter(Boolean); const pb=[...$('#addPrio').children].findIndex(b=>b.classList.contains('on')); const prio=[null,'now','soon','someday'][pb]; const ty=['article','project','practice'][[...$('#addType').children].findIndex(b=>b.classList.contains('on'))]; lines.forEach(v=>add({title:v,type:ty,area:'Unsorted',topic:'',ingested:iso(TODAY),enrich:true,prio,note:$('#addNote').value.trim()||null})); closeAdd(); $('#addUrl').value=''; $('#addNote').value=''; renderAll(); toast(lines.length?`Added ${lines.length} to Unsorted`:'Nothing to add'); };
addEventListener('keydown',e=>{ if(e.key==='Escape'){closeAdd();closeItem();} if(e.key==='a'&&!/INPUT/.test(document.activeElement.tagName)&&!document.body.classList.contains('md')){e.preventDefault();openAdd();} });
renderAll();
const h = location.hash.slice(1);
if (['wb','lib','plan','ins'].includes(h)) go(h);
if (h.startsWith('item=')) { const it=find(decodeURIComponent(h.slice(5))); addTime(it.id,.5); addTime(it.id,.5); openItem(it.id); }
if (h==='add') openAdd();
setTimeout(()=>scrollTo(0,0),0);
</script>
</body>
